services:
  transactional:
    image: postgres:12
    environment:
      POSTGRES_DB: dvdrental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./data/dvdrental.sql:/docker-entrypoint-initdb.d/dvdrental.sql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dvdrental"]
      interval: 5s
      timeout: 5s
      retries: 5

  analytics:
    image: postgres:12
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - 5440:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  job:
    build: .
    depends_on:
      transactional:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      - SOURCE_DB_HOST=transactional
      - SOURCE_DB_PORT=5432
      - SOURCE_DB_NAME=dvdrental
      - SOURCE_DB_USER=postgres
      - SOURCE_DB_PASSWORD=password
      - DEST_DB_HOST=analytics
      - DEST_DB_PORT=5432
      - DEST_DB_NAME=analytics
      - DEST_DB_USER=postgres
      - DEST_DB_PASSWORD=password

volumes:
  postgres:
